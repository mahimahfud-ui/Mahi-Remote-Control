name: Backend verification

on:
  push:
    branches:
      - work/remote-access-hardening
    paths:
      - "backend/**"
      - ".github/workflows/backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript backend
        run: npm run build

      - name: Run backend integration tests
        run: npm test
