name: Backend verification

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - "infrastructure/deployment/**"
      - ".github/workflows/backend-verification.yml"
  pull_request:
    branches:
      - main
      - fix/full-remote-workflow
    paths:
      - "backend/**"
      - "infrastructure/deployment/**"
      - ".github/workflows/backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mahi_admin
          POSTGRES_PASSWORD: integration-postgres-password
          POSTGRES_DB: mahi_remote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahi_admin -d mahi_remote_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://mahi_admin:integration-postgres-password@127.0.0.1:5432/mahi_remote_test
      JWT_SECRET: integration-only-jwt-secret-at-least-32-bytes
      PAIRING_CODE_PEPPER: integration-only-pairing-pepper-32-bytes
      TURN_SERVER_URL: turn:turn.integration.invalid:3478
      TURN_REALM: turn.integration.invalid
      TURN_SHARED_SECRET: integration-only-turn-secret-not-for-production
      STUN_SERVER_URL: stun:stun.integration.invalid:3478
      PUBLIC_BASE_URL: https://remote.integration.test
      INSTANCE_ID: integration-primary
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript backend
        run: npm run build

      - name: Check browser controller JavaScript syntax
        run: |
          node --check public/js/app.js
          node --check public/app.js

      - name: Run PostgreSQL-backed integration tests
        run: npm test

      - name: Build production backend container
        run: docker build -t mahi-remote-backend:ci .

      - name: Validate production Compose configuration
        working-directory: .
        run: docker compose --env-file infrastructure/deployment/.env.example -f infrastructure/deployment/docker-compose.yml config --quiet
