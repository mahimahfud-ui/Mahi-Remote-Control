name: Mahi Remote Control CI

on:
  push:
    branches:
      - main
      - work/anywhere-remote-control
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js

  android:
    name: Android debug build, unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Run Android unit tests, debug APK build and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MahiRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
