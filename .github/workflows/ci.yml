name: Mahi Remote Control CI

on:
  push:
    branches:
      - main
      - work/anywhere-remote-control
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mahi-remote-control-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js

  android:
    name: Android debug build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy Android SDK "tools" package is no longer published.
          packages: platform-tools
      - name: Install required Android SDK platforms
        run: sdkmanager --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic
      - name: Generate ephemeral CI debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Run Android unit tests, debug APK build and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: MahiRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-controller:
    name: Windows controller build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore Windows solution
        run: dotnet restore windows-controller/MahiRemote.sln
      - name: Build Windows controller
        run: dotnet build windows-controller/MahiRemote.sln --configuration Release --no-restore
