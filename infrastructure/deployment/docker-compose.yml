version: '3.8'

services:
  signaling-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mahi-signaling-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL to your HTTPS browser host}
      - JWT_SECRET=${JWT_SECRET:?Set a random JWT_SECRET of at least 32 bytes}
      - STUN_SERVER_URL=${STUN_SERVER_URL:-stun:stun.l.google.com:19302}
      - TURN_SERVER_URL=${TURN_SERVER_URL:?Set TURN_SERVER_URL to your deployed Coturn endpoint}
      - TURN_REALM=${TURN_REALM:?Set TURN_REALM to your public TURN hostname}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in the deployment environment}
      - DATABASE_URL=postgres://mahi_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres-db:5432/mahi_remote
    depends_on:
      - postgres-db
    restart: always

  postgres-db:
    image: postgres:16-alpine
    container_name: mahi-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mahi_admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
      - POSTGRES_DB=mahi_remote
    volumes:
      - mahi-postgres-data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  coturn-server:
    image: coturn/coturn:latest
    container_name: mahi-coturn
    network_mode: "host"
    volumes:
      - ./coturn.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:?Set TURN_REALM in the deployment environment}
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in the deployment environment}
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: mahi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

volumes:
  mahi-postgres-data:
