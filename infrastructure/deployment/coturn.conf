# Coturn external-auth configuration for Mahi Remote Control.
# Configure the matching private TURN_SHARED_SECRET through Compose's command arguments.
listening-port=3478
# TURN/TLS on 5349 is intentionally not enabled until real certificate/key files are supplied.
# tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
total-quota=100
bps-capacity=0
stale-nonce
no-loopback-peers
no-multicast-peers
min-port=49152
max-port=65535
